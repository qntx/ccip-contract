[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.36"
auto_detect_solc = false
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
deny = "warnings"
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
multiline_func_header = "params_first"

# setURL matches the ccip-tools / SetUrlDialog ABI (not mixedCase).
# Packed keccak256 is the ENS Labs gateway preimage; must not be rewritten as assembly.
# Signature expiry is defined against block.timestamp (EIP-3668 / Labs verifier).
[lint]
exclude_lints = ["mixed-case-function", "asm-keccak256", "block-timestamp"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
